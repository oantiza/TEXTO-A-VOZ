name: Calidad

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar tipos
        run: npm run lint
      - name: Ejecutar pruebas
        run: npm test
      - name: Crear versión de producción
        run: npm run build
