        background: #f8fafc;
        color: #0f172a;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(99, 102, 241, 0.18), transparent 38%),

        padding: 34px;
        border: 1px solid #e2e8f0;

        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
        text-align: center;
      }

      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: linear-gradient(135deg, #4f46e5, #9333ea);
        color: white;
        font-size: 30px;
        box-shadow: 0 12px 28px rgba(79, 70, 229, 0.28);
      }

      h1 { margin: 0 0 10px; font-size: 28px; letter-spacing: -0.035em; }
      p { margin: 0 0 24px; color: #64748b; line-height: 1.6; }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 14px;
        background: #4f46e5;
        color: white;
        font-weight: 750;
        text-decoration: none;
        transition: transform 150ms ease, background 150ms ease;
      }

      a:hover { background: #4338ca; transform: translateY(-1px); }
      small { display: block; margin-top: 18px; color: #94a3b8; }
